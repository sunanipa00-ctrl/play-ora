<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fabrilife Side Drawer</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-[#F2F4F7] text-slate-800">

  <!-- ==================== BACKGROUND SHOP PAGE (প্রোডাক্ট পেজ প্রিভিউ) ==================== -->
  <div class="min-h-screen pb-20">
    <!-- Top Header -->
    <header class="bg-white border-b border-slate-200 px-4 py-3 flex justify-between items-center sticky top-0 z-10">
      <div class="flex items-center gap-3">
        <button onclick="openDrawer()" class="text-2xl text-slate-800 active:scale-95 transition">☰</button>
        <span class="text-xl font-black tracking-tight text-slate-900">FABRI<span class="text-[#E02424]">LIFE</span></span>
      </div>
      <div class="flex items-center gap-3 text-lg text-slate-700">
        <button>🔍</button>
        <button>🤍</button>
      </div>
    </header>

    <!-- Demo Product View Behind Drawer -->
    <div class="p-4 max-w-sm mx-auto space-y-4">
      <div class="bg-white rounded-2xl p-4 border border-slate-200 text-center">
        <div class="aspect-[3/4] bg-slate-100 rounded-xl overflow-hidden relative">
          <img src="https://images.unsplash.com/photo-1521572267360-ee0c2909d518?w=600&q=80" class="w-full h-full object-cover" />
          <span class="absolute bottom-2 right-2 bg-black/60 text-white text-[10px] px-2 py-1 rounded">Click to zoom</span>
        </div>
        <h2 class="text-sm font-bold mt-3">Premium Heavyweight Cotton T-Shirt</h2>
        <span class="text-base font-black text-[#E02424]">৳৫২০</span>
        <button onclick="openDrawer()" class="mt-3 w-full py-2.5 bg-black text-white text-xs font-bold rounded-xl active:scale-95 transition">
          মেনু দেখতে এখানে চাপুন (Open Drawer)
        </button>
      </div>
    </div>
  </div>

  <!-- ==================== FABRILIFE EXACT SIDE DRAWER ==================== -->
  <div id="drawerOverlay" class="fixed inset-0 bg-black/50 backdrop-blur-xs z-50 transition-opacity duration-300">
    <div id="drawerContainer" class="bg-white w-[82%] max-w-xs h-full shadow-2xl flex flex-col justify-between overflow-y-auto no-scrollbar transform transition-transform duration-300 ease-out">
      
      <div>
        <!-- 1. Black Top Header (Welcome to Fabrilife + Close Button) -->
        <div class="bg-black text-white px-4 py-3.5 flex justify-between items-center">
          <span class="text-[15px] font-semibold tracking-wide">Welcome to Fabrilife</span>
          <button onclick="closeDrawer()" class="w-7 h-7 rounded-full bg-zinc-800 text-white flex items-center justify-center text-xs active:scale-90 transition">
            ✕
          </button>
        </div>

        <!-- 2. Login / Register Pill Switcher -->
        <div class="bg-black px-4 pb-4.5 pt-1">
          <div class="grid grid-cols-2 gap-2">
            <button onclick="handleAuthClick('login')" class="py-2 bg-white text-black text-xs font-bold rounded-lg shadow-sm active:scale-95 transition text-center">
              Login
            </button>
            <button onclick="handleAuthClick('register')" class="py-2 bg-[#2B2B2B] text-white text-xs font-semibold rounded-lg active:scale-95 transition text-center border border-zinc-700/50">
              Register
            </button>
          </div>
        </div>

        <!-- 3. Primary Navigation List -->
        <div class="py-2 px-2 divide-y divide-slate-100">
          <div class="space-y-0.5 pb-2">
            <a href="#" class="flex items-center gap-3.5 px-3 py-2.5 text-[13px] font-medium text-slate-700 hover:bg-slate-50 rounded-lg active:bg-slate-100">
              <span class="text-base text-slate-600">🏠</span>
              <span>Home</span>
            </a>
            <a href="#" class="flex items-center gap-3.5 px-3 py-2.5 text-[13px] font-medium text-slate-700 hover:bg-slate-50 rounded-lg active:bg-slate-100">
              <span class="text-base text-slate-600">⊞</span>
              <span>Shop All</span>
            </a>
            <a href="#" class="flex items-center gap-3.5 px-3 py-2.5 text-[13px] font-medium text-slate-700 hover:bg-slate-50 rounded-lg active:bg-slate-100">
              <span class="text-base text-[#10B981]">★</span>
              <span>New Arrivals</span>
            </a>
            <a href="#" class="flex items-center gap-3.5 px-3 py-2.5 text-[13px] font-medium text-[#0284C7] hover:bg-slate-50 rounded-lg active:bg-slate-100">
              <span class="text-base">🚚</span>
              <span>Free Delivery</span>
            </a>
            <a href="#" class="flex items-center gap-3.5 px-3 py-2.5 text-[13px] font-medium text-slate-700 hover:bg-slate-50 rounded-lg active:bg-slate-100">
              <span class="text-base text-slate-600">🔥</span>
              <span>Top Selling</span>
            </a>
          </div>

          <!-- 4. Categories Section -->
          <div class="pt-3 pb-2">
            <span class="block px-3 text-[11px] font-semibold text-slate-400 tracking-wider uppercase mb-1">
              CATEGORIES
            </span>
            <div class="space-y-0.5">
              <a href="#" class="flex items-center justify-between px-3 py-2.5 text-[13px] font-medium text-slate-700 hover:bg-slate-50 rounded-lg active:bg-slate-100">
                <div class="flex items-center gap-3.5">
                  <span class="text-base text-slate-600">🧍‍♂️</span>
                  <span>Men's Collection</span>
                </div>
                <span class="text-slate-400 text-sm font-bold">›</span>
              </a>
              <a href="#" class="flex items-center justify-between px-3 py-2.5 text-[13px] font-medium text-slate-700 hover:bg-slate-50 rounded-lg active:bg-slate-100">
                <div class="flex items-center gap-3.5">
                  <span class="text-base text-slate-600">🧍‍♀️</span>
                  <span>Women's Collection</span>
                </div>
                <span class="text-slate-400 text-sm font-bold">›</span>
              </a>
              <a href="#" class="flex items-center justify-between px-3 py-2.5 text-[13px] font-medium text-slate-700 hover:bg-slate-50 rounded-lg active:bg-slate-100">
                <div class="flex items-center gap-3.5">
                  <span class="text-base text-slate-600">🧒</span>
                  <span>Kids Collection</span>
                </div>
                <span class="text-slate-400 text-sm font-bold">›</span>
              </a>
              <a href="#" class="flex items-center justify-between px-3 py-2.5 text-[13px] font-medium text-slate-700 hover:bg-slate-50 rounded-lg active:bg-slate-100">
                <div class="flex items-center gap-3.5">
                  <span class="text-base text-slate-600">🎓</span>
                  <span>Teens Collection</span>
                </div>
                <span class="text-slate-400 text-sm font-bold">›</span>
              </a>
            </div>
          </div>

          <!-- 5. My Account Section -->
          <div class="pt-3 pb-4">
            <span class="block px-3 text-[11px] font-semibold text-slate-400 tracking-wider uppercase mb-1">
              MY ACCOUNT
            </span>
            <div class="space-y-0.5">
              <a href="#" class="flex items-center gap-3.5 px-3 py-2.5 text-[13px] font-medium text-slate-700 hover:bg-slate-50 rounded-lg active:bg-slate-100">
                <span class="text-base text-slate-500">🤍</span>
                <span>My Wishlist</span>
              </a>
            </div>
          </div>
        </div>
      </div>

    </div>
  </div>

  <script>
    const overlay = document.getElementById('drawerOverlay');
    const drawer = document.getElementById('drawerContainer');

    // সাইট ওপেন হলেই স্ক্রিনশটের মতো ড্রয়ারটি ওপেন থাকবে
    window.addEventListener('DOMContentLoaded', () => {
      openDrawer();
    });

    function openDrawer() {
      overlay.classList.remove('hidden');
      drawer.style.transform = 'translateX(0)';
    }

    function closeDrawer() {
      drawer.style.transform = 'translateX(-100%)';
      setTimeout(() => {
        overlay.classList.add('hidden');
      }, 200);
    }

    // ব্যাকগ্রাউন্ডের কালো অংশে চাপ দিলেও বন্ধ হবে
    overlay.addEventListener('click', (e) => {
      if (e.target === overlay) closeDrawer();
    });

    function handleAuthClick(type) {
      alert(`${type.toUpperCase()} পেজ ওপেন হচ্ছে...`);
    }
  </script>
</body>
</html>
