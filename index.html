<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FABRI-STYLE | Premium Clothing Brand</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-[#F8F9FA] text-[#1A1A1A] pb-24 select-none">

  <!-- Top Announcement Bar -->
  <div class="bg-black text-white text-[10px] py-1.5 px-4 text-center font-bold tracking-wider uppercase">
    ⚡ সারাদেশে ক্যাশ অন ডেলিভারি | ৩টি কিনলে ফ্রি শিপিং!
  </div>

  <!-- Header -->
  <header class="bg-white/95 backdrop-blur-md border-b border-slate-100 px-4 py-3 sticky top-0 z-40 flex justify-between items-center shadow-xs">
    <div class="flex items-center gap-2.5">
      <button class="text-xl">☰</button>
      <span class="text-xl font-black tracking-tighter text-slate-900">FABRI<span class="text-[#E02424]">LIFE</span></span>
    </div>
    <div class="flex items-center gap-3">
      <button class="text-lg">🔍</button>
      <button onclick="toggleCartDrawer()" class="relative text-xl">
        🛒
        <span id="cartCountBadge" class="absolute -top-1 -right-1.5 bg-[#E02424] text-white text-[9px] w-4 h-4 rounded-full flex items-center justify-center font-black">0</span>
      </button>
    </div>
  </header>

  <main class="max-w-md mx-auto space-y-4">
    <!-- Category Story Bubbles (Fabrilife Signature Style) -->
    <div class="bg-white py-3 px-4 border-b border-slate-100 flex gap-4 overflow-x-auto no-scrollbar">
      <div class="flex flex-col items-center gap-1 shrink-0">
        <div class="w-14 h-14 rounded-full p-0.5 border-2 border-[#E02424]">
          <img src="https://images.unsplash.com/photo-1521572267360-ee0c2909d518?w=200&q=80" class="w-full h-full object-cover rounded-full" />
        </div>
        <span class="text-[11px] font-bold">টি-শার্ট</span>
      </div>
      <div class="flex flex-col items-center gap-1 shrink-0">
        <div class="w-14 h-14 rounded-full p-0.5 border border-slate-200">
          <img src="https://images.unsplash.com/photo-1596755094514-f87e34085b2c?w=200&q=80" class="w-full h-full object-cover rounded-full" />
        </div>
        <span class="text-[11px] font-bold">শার্ট</span>
      </div>
      <div class="flex flex-col items-center gap-1 shrink-0">
        <div class="w-14 h-14 rounded-full p-0.5 border border-slate-200">
          <img src="https://images.unsplash.com/photo-1556905055-8f358a7a47b2?w=200&q=80" class="w-full h-full object-cover rounded-full" />
        </div>
        <span class="text-[11px] font-bold">হুডি</span>
      </div>
      <div class="flex flex-col items-center gap-1 shrink-0">
        <div class="w-14 h-14 rounded-full p-0.5 border border-slate-200">
          <img src="https://images.unsplash.com/photo-1624378439575-d8705ad7ae80?w=200&q=80" class="w-full h-full object-cover rounded-full" />
        </div>
        <span class="text-[11px] font-bold">পলো</span>
      </div>
      <div class="flex flex-col items-center gap-1 shrink-0">
        <div class="w-14 h-14 rounded-full p-0.5 border border-slate-200">
          <img src="https://images.unsplash.com/photo-1584370848010-d7fe6bc767ec?w=200&q=80" class="w-full h-full object-cover rounded-full" />
        </div>
        <span class="text-[11px] font-bold">প্যান্ট</span>
      </div>
    </div>

    <!-- Editorial Fashion Hero Banner -->
    <div class="px-4">
      <div class="relative overflow-hidden rounded-[18px] bg-slate-900 text-white aspect-[16/9] flex items-center p-6 shadow-md">
        <img src="https://images.unsplash.com/photo-1489987707025-afc232f7ea0f?w=800&q=80" class="absolute inset-0 w-full h-full object-cover opacity-60" />
        <div class="relative z-10 space-y-1">
          <span class="bg-white text-black text-[9px] font-black px-2 py-0.5 rounded uppercase tracking-wider">Summer '26 Drop</span>
          <h2 class="text-xl font-black leading-tight tracking-tight">PREMIUM COMBED<br/>COTTON TEES</h2>
          <p class="text-xs text-slate-200">১৮০ GSM ১০০% অর্গানিক কটন</p>
          <button class="mt-2 bg-[#E02424] text-white text-xs font-bold px-4 py-2 rounded-[8px]">কালেকশন দেখুন →</button>
        </div>
      </div>
    </div>

    <!-- Product Filter Bar -->
    <div class="px-4 flex justify-between items-center">
      <div>
        <h3 class="text-sm font-black uppercase tracking-wide">নতুন আগমনী কালেকশন</h3>
        <p class="text-[11px] text-slate-500">প্রিমিয়াম কোয়ালিটি ফ্যাশন ওয়্যার</p>
      </div>
      <button class="text-xs font-bold text-[#E02424] border border-[#E02424]/30 px-3 py-1 rounded-full">সব দেখুন ›</button>
    </div>

    <!-- 2-Column Clean Fashion Product Grid -->
    <div id="productGrid" class="px-4 grid grid-cols-2 gap-3">
      <!-- Injected via JS -->
    </div>
  </main>

  <!-- Product Detail & Variant Selector Modal -->
  <div id="productModal" class="hidden fixed inset-0 bg-black/60 backdrop-blur-xs z-50 flex items-end justify-center">
    <div class="bg-white w-full max-w-md rounded-t-[24px] p-5 space-y-4 max-h-[85vh] overflow-y-auto no-scrollbar">
      <div class="flex justify-between items-start">
        <div class="flex gap-3">
          <img id="modalImg" class="w-16 h-20 object-cover rounded-lg bg-slate-100" />
          <div>
            <h3 id="modalTitle" class="text-xs font-black line-clamp-2"></h3>
            <div class="flex items-center gap-2 mt-1">
              <span id="modalPrice" class="text-sm font-black text-[#E02424]"></span>
              <span id="modalOrigPrice" class="text-xs text-slate-400 line-through"></span>
            </div>
            <span class="text-[10px] text-emerald-600 font-bold">ইন স্টক (রেডি ডেলিভারি)</span>
          </div>
        </div>
        <button onclick="closeProductModal()" class="text-slate-400 text-lg font-bold">✕</button>
      </div>

      <!-- Color Selector -->
      <div>
        <label class="block text-[11px] font-bold text-slate-700 mb-1.5">কালার সিলেক্ট করুন:</label>
        <div class="flex gap-2">
          <button class="px-3 py-1.5 border-2 border-black rounded-lg text-xs font-bold">জেট ব্ল্যাক</button>
          <button class="px-3 py-1.5 border border-slate-200 rounded-lg text-xs text-slate-600">অলিভ গ্রিন</button>
          <button class="px-3 py-1.5 border border-slate-200 rounded-lg text-xs text-slate-600">নেভি ব্লু</button>
        </div>
      </div>

      <!-- Size Selector -->
      <div>
        <div class="flex justify-between items-center mb-1.5">
          <label class="text-[11px] font-bold text-slate-700">সাইজ সিলেক্ট করুন:</label>
          <span class="text-[10px] text-[#E02424] font-bold underline cursor-pointer">সাইজ চার্ট</span>
        </div>
        <div class="grid grid-cols-4 gap-2">
          <button onclick="selectSize(this)" class="size-btn py-2 border-2 border-black bg-slate-50 text-xs font-black rounded-[8px]">M</button>
          <button onclick="selectSize(this)" class="size-btn py-2 border border-slate-200 text-xs font-bold rounded-[8px]">L</button>
          <button onclick="selectSize(this)" class="size-btn py-2 border border-slate-200 text-xs font-bold rounded-[8px]">XL</button>
          <button onclick="selectSize(this)" class="size-btn py-2 border border-slate-200 text-xs font-bold rounded-[8px]">XXL</button>
        </div>
      </div>

      <!-- Add to Cart / Buy Now Action -->
      <div class="flex gap-2 pt-2">
        <button onclick="addToCartFromModal()" class="flex-1 py-3 bg-black text-white text-xs font-black rounded-[12px] active:scale-95 transition">
          কার্টে যোগ করুন
        </button>
        <button onclick="instantBuyNow()" class="flex-1 py-3 bg-[#E02424] text-white text-xs font-black rounded-[12px] active:scale-95 transition">
          সরাসরি অর্ডার করুন
        </button>
      </div>
    </div>
  </div>

  <!-- Cart Drawer -->
  <div id="cartDrawer" class="hidden fixed inset-0 bg-black/60 backdrop-blur-xs z-50 flex justify-end">
    <div class="bg-white w-full max-w-xs h-full p-4 flex flex-col justify-between">
      <div>
        <div class="flex justify-between items-center border-b border-slate-100 pb-3">
          <h3 class="text-sm font-black">আপনার শপিং ব্যাগ</h3>
          <button onclick="toggleCartDrawer()" class="text-lg">✕</button>
        </div>
        <div id="cartList" class="divide-y divide-slate-100 overflow-y-auto max-h-[65vh] py-2"></div>
      </div>

      <div class="border-t border-slate-100 pt-3 space-y-2">
        <div class="flex justify-between text-xs font-bold">
          <span>সাবটোটাল</span>
          <span id="cartSubtotal">৳০</span>
        </div>
        <button onclick="alert('ক্যাশ অন ডেলিভারি চেকআউট পেজে পাঠানো হচ্ছে...')" class="w-full py-3 bg-[#E02424] text-white text-xs font-black rounded-[10px] shadow active:scale-95">
          চেকআউট সম্পন্ন করুন →
        </button>
      </div>
    </div>
  </div>

  <script>
    const FABRI_PRODUCTS = [
      {
        id: 101,
        name: 'Retro Typography Heavyweight T-Shirt',
        category: 'Graphic Tees',
        price: 520,
        originalPrice: 650,
        badge: 'TRENDING',
        image: 'https://images.unsplash.com/photo-1521572267360-ee0c2909d518?w=600&q=80'
      },
      {
        id: 102,
        name: 'Drop Shoulder Minimalist Oversized Tee',
        category: 'Oversized',
        price: 590,
        originalPrice: 750,
        badge: 'NEW',
        image: 'https://images.unsplash.com/photo-1503342217505-b0a15ec3261c?w=600&q=80'
      },
      {
        id: 103,
        name: 'Classic Oxford Button-Down Formal Shirt',
        category: 'Formal Wear',
        price: 1150,
        originalPrice: 1400,
        badge: 'POPULAR',
        image: 'https://images.unsplash.com/photo-1596755094514-f87e34085b2c?w=600&q=80'
      },
      {
        id: 104,
        name: 'Premium Combed Ribbed Polo Shirt',
        category: 'Polo',
        price: 780,
        originalPrice: 950,
        badge: 'EXCLUSIVE',
        image: 'https://images.unsplash.com/photo-1624378439575-d8705ad7ae80?w=600&q=80'
      }
    ];

    let cart = [];
    let selectedModalProduct = null;

    function renderProducts() {
      const container = document.getElementById('productGrid');
      container.innerHTML = FABRI_PRODUCTS.map(p => `
        <div class="bg-white rounded-[14px] border border-slate-100 overflow-hidden flex flex-col justify-between shadow-2xs">
          <div class="relative aspect-[3/4] bg-slate-100 cursor-pointer" onclick="openProductModal(${p.id})">
            <img src="${p.image}" class="w-full h-full object-cover" />
            <span class="absolute top-2 left-2 bg-black text-white text-[8px] font-black px-2 py-0.5 rounded tracking-wide">
              ${p.badge}
            </span>
          </div>
          <div class="p-2.5 flex-1 flex flex-col justify-between">
            <div>
              <span class="text-[9px] text-slate-400 font-bold uppercase">${p.category}</span>
              <h4 class="text-xs font-bold text-slate-900 line-clamp-2 mt-0.5 leading-snug cursor-pointer" onclick="openProductModal(${p.id})">${p.name}</h4>
            </div>
            <div class="mt-2.5 pt-2 border-t border-slate-50 flex items-center justify-between">
              <div>
                <span class="text-xs font-black text-[#1A1A1A]">৳${p.price}</span>
                <span class="text-[10px] text-slate-400 line-through block">৳${p.originalPrice}</span>
              </div>
              <button onclick="openProductModal(${p.id})" class="px-2.5 py-1.5 bg-black text-white text-[10px] font-bold rounded-[6px] active:scale-90 transition">
                + সাইজ
              </button>
            </div>
          </div>
        </div>
      `).join('');
    }

    function openProductModal(id) {
      selectedModalProduct = FABRI_PRODUCTS.find(p => p.id === id);
      document.getElementById('modalImg').src = selectedModalProduct.image;
      document.getElementById('modalTitle').innerText = selectedModalProduct.name;
      document.getElementById('modalPrice').innerText = `৳${selectedModalProduct.price}`;
      document.getElementById('modalOrigPrice').innerText = `৳${selectedModalProduct.originalPrice}`;
      document.getElementById('productModal').classList.remove('hidden');
    }

    function closeProductModal() {
      document.getElementById('productModal').classList.add('hidden');
    }

    function selectSize(btn) {
      document.querySelectorAll('.size-btn').forEach(b => {
        b.classList.remove('border-black', 'border-2', 'bg-slate-50', 'font-black');
        b.classList.add('border-slate-200', 'font-bold');
      });
      btn.classList.add('border-black', 'border-2', 'bg-slate-50', 'font-black');
      btn.classList.remove('border-slate-200', 'font-bold');
    }

    function addToCartFromModal() {
      if (!selectedModalProduct) return;
      const existing = cart.find(i => i.id === selectedModalProduct.id);
      if (existing) existing.qty += 1;
      else cart.push({ ...selectedModalProduct, qty: 1, size: 'M' });

      updateCartUI();
      closeProductModal();
      toggleCartDrawer();
    }

    function instantBuyNow() {
      addToCartFromModal();
      alert('সরাসরি ক্যাশ অন ডেলিভারি চেকআউট পেজে রিডাইরেক্ট করা হচ্ছে...');
    }

    function toggleCartDrawer() {
      document.getElementById('cartDrawer').classList.toggle('hidden');
    }

    function updateCartUI() {
      const count = cart.reduce((acc, i) => acc + i.qty, 0);
      document.getElementById('cartCountBadge').innerText = count;

      const list = document.getElementById('cartList');
      if (cart.length === 0) {
        list.innerHTML = '<div class="text-center py-10 text-xs text-slate-400">ব্যাগ খালি</div>';
      } else {
        list.innerHTML = cart.map(i => `
          <div class="py-2.5 flex items-center justify-between gap-2">
            <img src="${i.image}" class="w-12 h-14 object-cover rounded bg-slate-100" />
            <div class="flex-1">
              <h5 class="text-[11px] font-bold line-clamp-1">${i.name}</h5>
              <span class="text-[10px] text-slate-500">সাইজ: ${i.size} | ৳${i.price} × ${i.qty}</span>
            </div>
            <span class="text-xs font-black">৳${i.price * i.qty}</span>
          </div>
        `).join('');
      }

      const subtotal = cart.reduce((acc, i) => acc + (i.price * i.qty), 0);
      document.getElementById('cartSubtotal').innerText = `৳${subtotal}`;
    }

    renderProducts();
  </script>
</body>
            </html>
